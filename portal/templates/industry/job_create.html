{% extends 'base.html' %}

{% block title %}Post Opportunity | Skill Index{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Post New Internship / Placement Drive</h1>
  <p class="page-subtitle">Publish requirement details and required skills to students.</p>
</div>

<div class="card" style="max-width: 750px; margin: 0 auto;">
  <form method="POST" action="{% url 'job_create' %}">
    {% csrf_token %}
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Opportunity Title</label>
        <input type="text" name="title" class="form-control" placeholder="e.g. Software Engineering Intern" required>
      </div>
      <div class="form-group">
        <label class="form-label">Company Name</label>
        <input type="text" name="company_name" class="form-control" value="{{ user.profile.institution_or_company|default:'Google India' }}" required>
      </div>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label class="form-label">Type</label>
        <select name="opportunity_type" class="form-control" required>
          <option value="INTERNSHIP">Internship</option>
          <option value="FULL_TIME">Full Time Placement</option>
          <option value="PROJECT">Industry Project</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" placeholder="Bengaluru / Remote" required>
      </div>
      <div class="form-group">
        <label class="form-label">Stipend / Package</label>
        <input type="text" name="stipend_or_salary" class="form-control" placeholder="₹50,000 / month or 14 LPA" required>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Minimum Required CGPA</label>
        <input type="number" step="0.1" name="min_cgpa" class="form-control" value="7.5" required>
      </div>
      <div class="form-group">
        <label class="form-label">Application Deadline</label>
        <input type="date" name="deadline" class="form-control" required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Required Skills (Select multiple)</label>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 180px; overflow-y: auto; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
        {% for sk in all_skills %}
        <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" name="skills" value="{{ sk.id }}" style="accent-color: var(--primary);"> {{ sk.name }}
        </label>
        {% endfor %}
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Job Description & Qualifications</label>
      <textarea name="description" class="form-control" rows="5" placeholder="Detail the role, responsibilities, and expected outcomes..." required></textarea>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
      <a href="{% url 'dashboard' %}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Publish Opportunity</button>
    </div>
  </form>
</div>
{% endblock %}
